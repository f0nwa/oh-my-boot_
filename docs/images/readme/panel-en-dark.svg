      <rect x="126" y="216" width="96" height="6" rx="3" fill="#4CC38A"/>
      <text x="126" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">TFTP</text>
      <rect x="230" y="216" width="96" height="6" rx="3" fill="#4CC38A"/>
      <text x="230" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">iPXE</text>
      <rect x="334" y="216" width="96" height="6" rx="3" fill="#4CC38A"/>
      <text x="334" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Menu</text>
      <rect x="438" y="216" width="96" height="6" rx="3" fill="#4CC38A"/>
      <text x="438" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Pick</text>
      <rect x="542" y="216" width="96" height="6" rx="3" fill="#F2A93B"/>
      <text x="542" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Image</text>
  </g>
  <!-- Right card: server summary -->
  <g transform="translate(782 124)">
    <rect width="386" height="266" rx="10" fill="#15181D" stroke="#23272E" stroke-width="1.5"/>
    <text x="20" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#8A929E">SERVER &amp; SERVICES</text>
    <line x1="0" y1="46" x2="386" y2="46" stroke="#23272E"/>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8A929E">OMB Services</text><circle cx="192" cy="58" r="4.5" fill="#4CC38A"/><text x="204" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#4CC38A">7 / 7 active</text><line x1="20" y1="82" x2="366" y2="82" stroke="#23272E"/><text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8A929E">PXE Network</text><text x="188" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6E8EB">Full DHCP · UEFI SB</text><line x1="20" y1="126" x2="366" y2="126" stroke="#23272E"/><text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8A929E">ISO Storages</text><text x="188" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6E8EB">Local · SMB · NFS</text><line x1="20" y1="170" x2="366" y2="170" stroke="#23272E"/><text x="20" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8A929E">Access</text><text x="188" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6E8EB">HTTPS · 2FA · AD/OIDC</text><line x1="20" y1="214" x2="366" y2="214" stroke="#23272E"/><text x="20" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8A929E">Docs</text><text x="188" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6E8EB">Built-in Wiki RU/EN</text>
