name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Go & Script Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Script tests
        run: |
          python3 scripts/offline-deb_test.py
          bash scripts/offline-deploy_test.sh
          bash scripts/build-release_test.sh
          bash scripts/install_test.sh
