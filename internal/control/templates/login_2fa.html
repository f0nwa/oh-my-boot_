{{define "login_2fa"}}{{template "top" .}}
<div class="login-net-bg" aria-hidden="true"><svg class="login-net" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg></div>
<section class="login">
  <div class="page-head"><h1 class="login-brand"><span class="wordmark" aria-hidden="true">oh my boot<span class="wordmark-cursor"></span></span><span class="sr-only">{{t "Подтверждение входа"}}</span></h1></div>
  <form method="post" action="/login/2fa" class="login-form" id="login-2fa-form">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="mode" id="login-2fa-mode" value="totp">
    <p class="hint login-2fa-user">{{t "Учётная запись"}} <strong>{{.Username}}</strong></p>
    <div id="login-2fa-totp-wrap">
      <label class="field-label" for="login-2fa-code">{{t "Код из приложения-аутентификатора (6 цифр)"}}</label>
      <input id="login-2fa-code" name="code" class="input-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="000000" required autofocus>
    </div>
    <button class="btn btn-primary" type="submit" id="login-2fa-submit">{{t "Подтвердить"}}</button>
    <div class="login-2fa-links">
      <button type="button" class="link-btn" id="login-2fa-toggle" data-label-recovery="{{t "Использовать резервный код"}}" data-label-totp="{{t "Ввести код из приложения"}}" data-title-recovery="{{t "Одноразовый резервный код (XXXX-XXXX)"}}" data-title-totp="{{t "Код из приложения-аутентификатора (6 цифр)"}}">{{t "Использовать резервный код"}}</button>
      <a class="link-btn" href="/login">{{t "Назад ко входу"}}</a>
    </div>
  </form>
</section>
<script defer src="/assets/login-2fa.js"></script>
{{template "bottom" .}}{{end}}
