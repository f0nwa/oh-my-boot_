      <text x="230" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">iPXE</text>
      <rect x="334" y="110" width="96" height="6" rx="3" fill="#F2A93B"/>
      <text x="334" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Menu</text>
      <rect x="438" y="110" width="96" height="6" rx="3" fill="#2C313A"/>
      <text x="438" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Pick</text>
      <rect x="542" y="110" width="96" height="6" rx="3" fill="#2C313A"/>
      <text x="542" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A929E">Image</text>
    <line x1="22" y1="152" x2="708" y2="152" stroke="#23272E"/>
    <!-- Machine 2 -->
    <text x="22" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6E8EB">SRV-TEST-02  ·  QEMU / OVMF</text>
    <circle cx="430" cy="177" r="4.5" fill="#4CC38A"/>
    <text x="442" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#4CC38A">Loading WinPE (Windows 11 Pro)</text>
