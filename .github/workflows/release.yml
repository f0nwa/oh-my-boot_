name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.2.1 or v0.2.2-dev.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish .deb Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "Unsupported tag format: $TAG (expected vX.Y.Z or vX.Y.Z-dev.N)" >&2
            exit 1
          fi
          DEB_VER="${TAG#v}"
          DEB_VER="${DEB_VER//-dev./~dev.}"
          if [[ "$TAG" == *-dev.* ]]; then
            CHANNEL="dev"
            PRERELEASE="true"
          else
            CHANNEL="stable"
            PRERELEASE="false"
          fi
          {
            echo "tag=$TAG"
            echo "deb_version=$DEB_VER"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG DebVersion=$DEB_VER Channel=$CHANNEL Prerelease=$PRERELEASE"

      - name: Run tests before building release
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 scripts/offline-deb_test.py
          bash scripts/install_test.sh

      - name: Build .deb and SHA256SUMS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

          WORK_DIR="$(mktemp -d)"

          # Prepare pinned boot assets (verified by SHA-256)
          mkdir -p "$WORK_DIR/assets"
          curl -fsSL -o "$WORK_DIR/assets/ipxeboot.tar.gz" https://github.com/ipxe/ipxe/releases/download/v2.0.0/ipxeboot.tar.gz
          curl -fsSL -o "$WORK_DIR/assets/ipxe-shimx64.efi" https://github.com/ipxe/shim/releases/download/ipxe-16.1/ipxe-shimx64.efi
          curl -fsSL -o "$WORK_DIR/assets/wimboot" https://github.com/ipxe/wimboot/releases/download/v2.9.0/wimboot
          cat > "$WORK_DIR/assets/expected.sha256" <<'SUMS'
          01a526d4cc791fc30362259c609d6c506cc64a7bdff51b9a5eb788354e17eee1  ipxeboot.tar.gz
          5eecca2780bd49c900565e124516a1bd666ec5e012825f34991b6ba1ef2fa6cf  ipxe-shimx64.efi
          5f067ccdc4d084d5bf77b6c853bd0f8402dfc2b4cd1b103d358993ae97fae8e3  wimboot
          SUMS
          (cd "$WORK_DIR/assets" && sha256sum -c expected.sha256)

          # Minimal sysdebs placeholder required by build-release.sh (only omb_*.deb is published online)
          mkdir -p "$WORK_DIR/sysdebs"
          (cd "$WORK_DIR/sysdebs" && apt-get download base-files && dpkg-scanpackages -m . | gzip -9n > Packages.gz)

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$WORK_DIR/ephemeral.pem" 2>/dev/null
          bash scripts/build-release.sh \
            --version "${{ steps.meta.outputs.deb_version }}" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --sysdebs-dir "$WORK_DIR/sysdebs" \
            --assets-dir "$WORK_DIR/assets" \
            --sign-key "$WORK_DIR/ephemeral.pem" \
            --out "$WORK_DIR/apt-repo"
          rm -f "$WORK_DIR/ephemeral.pem"

          mkdir -p dist-release
          cp "$WORK_DIR/apt-repo/omb_${{ steps.meta.outputs.deb_version }}_amd64.deb" dist-release/
          cp "$WORK_DIR/SHA256SUMS" dist-release/
          (cd dist-release && sha256sum -c SHA256SUMS)
          ls -lh dist-release/

      - name: Upload .deb artifact for VM build
        uses: actions/upload-artifact@v4
        with:
          name: omb-deb
          path: dist-release/
          retention-days: 1

      - name: Publish GitHub Release (.deb)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          DEB="dist-release/omb_${{ steps.meta.outputs.deb_version }}_amd64.deb"
          SUMS="dist-release/SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" "$SUMS" --clobber
          else
            EXTRA_FLAGS=()
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              EXTRA_FLAGS+=(--prerelease)
            else
              EXTRA_FLAGS+=(--latest)
            fi
            gh release create "$TAG" "$DEB" "$SUMS" \
              --title "oh my boot_ $TAG" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi

  vm-image:
    name: Build & Publish VM Images (qcow2.xz + ova)
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.release.outputs.tag }}

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: omb-deb
          path: dist-release

      - name: Install VM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils cloud-guest-utils e2fsprogs xz-utils

      - name: Build Ubuntu 24.04 LTS VM images (qcow2.xz + ova)
        run: |
          DEB_VER="${{ needs.release.outputs.deb_version }}"
          sudo bash scripts/build-vm-image.sh \
            --deb "dist-release/omb_${DEB_VER}_amd64.deb" \
            --version "$DEB_VER" \
            --out dist-vm
          cat dist-release/SHA256SUMS dist-vm/SHA256SUMS.vm > dist-vm/SHA256SUMS
          cat dist-vm/SHA256SUMS

      - name: Upload VM images to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          DEB_VER="${{ needs.release.outputs.deb_version }}"
          gh release upload "$TAG" \
            "dist-vm/omb_${DEB_VER}_ubuntu24.04_amd64.qcow2.xz" \
            "dist-vm/omb_${DEB_VER}_ubuntu24.04_amd64.ova" \
            "dist-vm/SHA256SUMS" \
            --clobber
