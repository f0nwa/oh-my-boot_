{{define "users"}}{{template "top" .}}<div class="page-head"><div><h1>{{t "Пользователи"}}</h1><p class="lead">{{t "Кто может входить в админку и что ему разрешено."}}</p></div></div><details><summary>{{t "Добавить пользователя"}}</summary><form method="post" action="/users/create"><input type="hidden" name="csrf" value="{{.Info.CSRF}}"><label>{{t "Имя"}}</label><input name="username" required><label>{{t "Пароль, от 12 символов"}}</label><input type="password" name="password" minlength="12" autocomplete="new-password" required data-password-generator><label>{{t "Роль"}}</label><select name="role"><option value="observer">{{t "Наблюдатель"}}</option><option value="operator">{{t "Оператор"}}</option><option value="admin">{{t "Администратор"}}</option></select><button class="btn btn-primary">{{t "Создать"}}</button></form></details><section><div class="table-wrap"><table><tr><th>{{t "Имя"}}</th><th>{{t "Роль и доступ"}}</th></tr>{{range .Users}}<tr><td>{{.Username}} <small>#{{.ID}}</small></td><td><form method="post" action="/users/change"><input type="hidden" name="csrf" value="{{$.Info.CSRF}}"><input type="hidden" name="id" value="{{.ID}}"><select name="role"><option value="observer" {{if eq .Role "observer"}}selected{{end}}>{{t "Наблюдатель"}}</option><option value="operator" {{if eq .Role "operator"}}selected{{end}}>{{t "Оператор"}}</option><option value="admin" {{if eq .Role "admin"}}selected{{end}}>{{t "Администратор"}}</option></select><label><input style="width:auto" type="checkbox" name="enabled" {{if .Enabled}}checked{{end}}> {{t "Активен"}}</label><button>{{t "Сохранить"}}</button></form></td></tr>{{end}}</table></div></section><details><summary>{{t "Сменить пароль пользователю"}}</summary><form method="post" action="/users/reset-password"><input type="hidden" name="csrf" value="{{.Info.CSRF}}"><label>{{t "ID пользователя из списка"}}</label><input name="id" inputmode="numeric" required><label>{{t "Новый пароль, от 12 символов"}}</label><input name="password" type="password" minlength="12" autocomplete="new-password" required data-password-generator><button>{{t "Сменить пароль и завершить его сеансы"}}</button></form></details><script defer src="/assets/password.js"></script>{{template "bottom" .}}{{end}}
