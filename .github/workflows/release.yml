name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.2.1 or v0.2.2-dev.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish .deb Release
    runs-on: ubuntu-24.04
    environment: ${{ contains(inputs.tag || github.ref_name, '-dev.') && 'omb-dev-release' || 'omb-release' }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate release ref
        id: ref
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]; then
            echo "Expected a release tag in the form vX.Y.Z or vX.Y.Z-dev.N."
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.ref.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release metadata
        id: meta
        env:
          VALIDATED_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          TAG="$VALIDATED_TAG"
          DEB_VER="${TAG#v}"
          DEB_VER="${DEB_VER//-dev./~dev.}"
          if [[ "$TAG" == *-dev.* ]]; then
            CHANNEL="dev"
            PRERELEASE="true"
          else
            CHANNEL="stable"
            PRERELEASE="false"
          fi
          {
            echo "tag=$TAG"
            echo "deb_version=$DEB_VER"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG DebVersion=$DEB_VER Channel=$CHANNEL Prerelease=$PRERELEASE"

      - name: Run tests before building release
        run: |
          go vet ./...
          go test -count=1 ./...
          python3 scripts/offline-deb_test.py
          bash scripts/offline-deploy_test.sh
          bash scripts/build-release_test.sh
          bash scripts/install_test.sh

      - name: Build package and signed update archives
        env:
          OMB_RELEASE_SIGNING_KEY: ${{ secrets.OMB_RELEASE_SIGNING_KEY }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          DEB_VERSION: ${{ steps.meta.outputs.deb_version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == stable && -z "$OMB_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::Set OMB_RELEASE_SIGNING_KEY in the omb-release environment to publish the stable package and both signed update archives."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$WORK_DIR"' EXIT

          # Prepare pinned boot assets (verified by SHA-256)
          mkdir -p "$WORK_DIR/assets"
          curl -fsSL -o "$WORK_DIR/assets/ipxeboot.tar.gz" https://github.com/ipxe/ipxe/releases/download/v2.0.0/ipxeboot.tar.gz
          curl -fsSL -o "$WORK_DIR/assets/ipxe-shimx64.efi" https://github.com/ipxe/shim/releases/download/ipxe-16.1/ipxe-shimx64.efi
          curl -fsSL -o "$WORK_DIR/assets/wimboot" https://github.com/ipxe/wimboot/releases/download/v2.9.0/wimboot
          cat > "$WORK_DIR/assets/expected.sha256" <<'SUMS'
          01a526d4cc791fc30362259c609d6c506cc64a7bdff51b9a5eb788354e17eee1  ipxeboot.tar.gz
          5eecca2780bd49c900565e124516a1bd666ec5e012825f34991b6ba1ef2fa6cf  ipxe-shimx64.efi
          5f067ccdc4d084d5bf77b6c853bd0f8402dfc2b4cd1b103d358993ae97fae8e3  wimboot
          SUMS
          (cd "$WORK_DIR/assets" && sha256sum -c expected.sha256)

          mkdir -p dist-release "$WORK_DIR/ubuntu24.04/sysdebs"
          KEY="$WORK_DIR/signing.pem"
          SIGNED_ARCHIVES=false
          PUBLIC_KEY_ARGS=()
          if [[ -n "$OMB_RELEASE_SIGNING_KEY" ]]; then
            BRANCH=main
            if [[ "$RELEASE_CHANNEL" == dev ]]; then BRANCH=dev; fi
            git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$BRANCH"
            (umask 077; printf '%s\n' "$OMB_RELEASE_SIGNING_KEY" > "$KEY")
            openssl pkey -in "$KEY" -pubout -out dist-release/omb-release-public.pem
            PUBLIC_KEY_ARGS=(--release-public-key dist-release/omb-release-public.pem)
            SIGNED_ARCHIVES=true
          else
            echo "::warning::No release signing key. This development release contains the .deb only."
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$KEY" 2>/dev/null
          fi
          unset OMB_RELEASE_SIGNING_KEY

          # Update archives replace the OMB package on provisioned servers.
          # The signed repository index still needs a package from its target Ubuntu.
          (cd "$WORK_DIR/ubuntu24.04/sysdebs" && apt-get download base-files)
          if $SIGNED_ARCHIVES; then
            mkdir -p "$WORK_DIR/ubuntu26.04/sysdebs"
            docker run --rm --platform linux/amd64 \
              --volume "$WORK_DIR/ubuntu26.04/sysdebs:/out" --workdir /out \
              ubuntu:26.04 bash -ec 'apt-get update -qq && apt-get download base-files'
          fi

          build_for_ubuntu() {
            local ubuntu=$1 target="$WORK_DIR/ubuntu$1"
            local archive_args=()
            (cd "$target/sysdebs" && dpkg-scanpackages -m . | gzip -9n > Packages.gz)
            if $SIGNED_ARCHIVES; then
              archive_args=(--update-archive "dist-release/omb-update-${RELEASE_TAG#v}-ubuntu$ubuntu-amd64.tar.gz")
            fi
            bash scripts/build-release.sh \
              --target-ubuntu "$ubuntu" --version "$DEB_VERSION" --channel "$RELEASE_CHANNEL" \
              --sysdebs-dir "$target/sysdebs" --assets-dir "$WORK_DIR/assets" --sign-key "$KEY" \
              ${PUBLIC_KEY_ARGS[@]+"${PUBLIC_KEY_ARGS[@]}"} \
              --out "$target/apt-repo" "${archive_args[@]}"
          }

          build_for_ubuntu 24.04
          DEB="omb_${DEB_VERSION}_amd64.deb"
          if $SIGNED_ARCHIVES; then
            build_for_ubuntu 26.04
            cmp "$WORK_DIR/ubuntu24.04/apt-repo/$DEB" "$WORK_DIR/ubuntu26.04/apt-repo/$DEB"
          fi
          rm -f "$KEY"

          cp "$WORK_DIR/ubuntu24.04/apt-repo/$DEB" "$WORK_DIR/ubuntu24.04/SHA256SUMS" dist-release/
          (cd dist-release && sha256sum -c SHA256SUMS)
          ls -lh dist-release/

      - name: Upload .deb artifact for VM build
        uses: actions/upload-artifact@v4
        with:
          name: omb-deb
          path: |
            dist-release/omb_*.deb
            dist-release/SHA256SUMS
          retention-days: 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          DEB="dist-release/omb_${{ steps.meta.outputs.deb_version }}_amd64.deb"
          SUMS="dist-release/SHA256SUMS"
          ASSETS=("$DEB" "$SUMS")
          for ubuntu in 24.04 26.04; do
            ARCHIVE="dist-release/omb-update-${TAG#v}-ubuntu$ubuntu-amd64.tar.gz"
            if [[ -f "$ARCHIVE" ]]; then
              ASSETS+=("$ARCHIVE")
            elif [[ "${{ steps.meta.outputs.channel }}" == stable ]]; then
              echo "::error::Missing required stable update archive: $ARCHIVE"
              exit 1
            fi
          done
          PUBKEY="dist-release/omb-release-public.pem"
          if [[ -f "$PUBKEY" ]]; then
            ASSETS+=("$PUBKEY")
          elif [[ "${{ steps.meta.outputs.channel }}" == stable ]]; then
            echo "::error::Missing required release public key: $PUBKEY"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            EXTRA_FLAGS=()
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              EXTRA_FLAGS+=(--prerelease)
            else
              EXTRA_FLAGS+=(--latest)
            fi
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "oh my boot_ $TAG" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi

  vm-image:
    name: Build & Publish VM Images (qcow2.xz + ova)
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || needs.release.outputs.tag }}

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: omb-deb
          path: dist-release

      - name: Install VM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils cloud-guest-utils e2fsprogs xz-utils

      - name: Build Ubuntu 24.04 LTS VM images (qcow2.xz + ova)
        run: |
          DEB_VER="${{ needs.release.outputs.deb_version }}"
          mkdir -p dist-vm
          sudo bash scripts/build-vm-image.sh \
            --deb "dist-release/omb_${DEB_VER}_amd64.deb" \
            --version "$DEB_VER" \
            --out dist-vm
          cat dist-release/SHA256SUMS dist-vm/SHA256SUMS.vm > dist-vm/SHA256SUMS
          cat dist-vm/SHA256SUMS

      - name: Upload VM images to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          DEB_VER="${{ needs.release.outputs.deb_version }}"
          gh release upload "$TAG" \
            "dist-vm/omb_${DEB_VER}_ubuntu24.04_amd64.qcow2.xz" \
            "dist-vm/omb_${DEB_VER}_ubuntu24.04_amd64.ova" \
            "dist-vm/SHA256SUMS" \
            --clobber
