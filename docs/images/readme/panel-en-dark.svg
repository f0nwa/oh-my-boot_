<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="416" viewBox="0 0 1200 416" role="img" aria-labelledby="title desc">
  <title id="title">Oh My Boot Web Control Panel</title>
  <desc id="desc">The Live view of the Oh My Boot web panel showing the menu draft bar, active PXE clients with stage progress, and service status.</desc>
  <rect width="1200" height="416" rx="16" fill="#0E1013" stroke="#23272E" stroke-width="2"/>
  <!-- Topbar -->
  <rect x="0" y="0" width="1200" height="58" rx="16" fill="#15181D"/>
  <rect x="0" y="42" width="1200" height="16" fill="#15181D"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#23272E" stroke-width="1"/>
  <text x="32" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#E6E8EB">oh my boot<tspan fill="#F2A93B">_</tspan></text>
  <rect x="218" y="14" width="82" height="30" rx="6" fill="#1F242C"/><text x="259.0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E6E8EB">Now</text><text x="349.0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A9B0BA">Menu</text><text x="439.0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A9B0BA">Library</text><text x="529.0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A9B0BA">Log</text><text x="619.0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#A9B0BA">System</text>
  <rect x="1032" y="14" width="66" height="30" rx="6" fill="#0E1013" stroke="#2C313A"/>
  <text x="1065" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#A9B0BA">Wiki</text>
  <rect x="1108" y="14" width="60" height="30" rx="6" fill="#0E1013" stroke="#2C313A"/>
  <text x="1138" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8A929E">⌘K</text>
