[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   map to guest = Never
   interfaces = lo ens19
   bind interfaces only = yes
   hosts allow = 127.0.0.1 10.30.0.0/24
   smb ports = 445
   server min protocol = SMB2_02
   server signing = mandatory
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[ombisos]
   path = /mnt/omb-iso/profiles
   browseable = no
   read only = yes
   guest ok = no
   valid users = omb-iso
