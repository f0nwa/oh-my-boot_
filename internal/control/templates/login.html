{{define "login"}}{{template "top" .}}<div class="login-net-bg" aria-hidden="true"><svg class="login-net" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg></div><section class="login"><div class="page-head"><h1 class="login-brand"><span class="wordmark" aria-hidden="true">oh my boot<span class="wordmark-cursor"></span></span><span class="sr-only">{{t "Вход в Oh My Boot"}}</span></h1></div><form method="post" action="/login" class="login-form"><input type="hidden" name="csrf" value="{{.CSRF}}">{{if .LDAPEnabled}}<input type="hidden" name="auth_mode" id="login-auth-mode" value="ldap"><div class="login-mode-seg" role="tablist" aria-label="{{t "Способ входа"}}"><button type="button" class="is-active" data-login-mode="ldap" data-label-user="{{t "Доменный логин (sAMAccountName или UPN)"}}" data-label-submit="{{t "Войти через домен"}}">{{t "Домен (AD)"}}</button><button type="button" data-login-mode="local" data-label-user="{{t "Имя пользователя"}}" data-label-submit="{{t "Войти"}}">{{t "Локальный"}}</button></div>{{end}}<div class="field-float"><input id="login-username" name="username" autocomplete="username" required><label for="login-username">{{if .LDAPEnabled}}{{t "Доменный логин (sAMAccountName или UPN)"}}{{else}}{{t "Имя пользователя"}}{{end}}</label></div><div class="field-float"><input id="login-password" type="password" name="password" autocomplete="current-password" required><label for="login-password">{{t "Пароль"}}</label></div><button class="btn btn-primary" disabled>{{if .LDAPEnabled}}{{t "Войти через домен"}}{{else}}{{t "Войти"}}{{end}}</button>{{if .KeycloakEnabled}}<div class="login-or-sep"><span>{{t "или"}}</span></div><a class="btn btn-kc" href="/auth/oidc/login"><span class="dot dot-accent" aria-hidden="true"></span>{{t "Войти через Keycloak"}}</a>{{end}}</form></section><script defer src="/assets/login.js"></script>{{template "bottom" .}}{{end}}
