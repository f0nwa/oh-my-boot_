  <rect x="0" y="58" width="1200" height="44" fill="#17140F"/>
  <line x1="0" y1="102" x2="1200" y2="102" stroke="#3A2E17" stroke-width="1"/>
  <circle cx="38" cy="80" r="4.5" fill="#F2A93B"/>
  <text x="54" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6E8EB">Menu draft  ·  v32 → v33  ·  +2  ~1</text>
  <rect x="1008" y="66" width="160" height="28" rx="6" fill="#F2A93B"/>
  <text x="1088" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1A1306">Publish v33</text>
